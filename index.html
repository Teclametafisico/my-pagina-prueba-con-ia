<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Página de prueba creada con ayuda de IA.">
  <title>Mi página de prueba con IA</title>
  <style>
    :root {
      --ink: #16213e;
      --muted: #5b6478;
      --accent: #6c4df6;
      --bg: #f6f7fb;
      --card: #ffffff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top right, #dbe7ff 0, transparent 38%),
        radial-gradient(circle at bottom left, #e4dcff 0, transparent 35%),
        var(--bg);
    }
    main {
      width: min(720px, 100%);
      padding: clamp(32px, 7vw, 64px);
      text-align: center;
      background: color-mix(in srgb, var(--card) 92%, transparent);
      border: 1px solid #e4e7f0;
      border-radius: 24px;
      box-shadow: 0 20px 55px #34385c1f;
    }
    .badge {
      display: inline-block;
      margin-bottom: 20px;
      padding: 8px 14px;
      border-radius: 999px;
      color: #5136d2;
      background: #eeeaff;
      font-weight: 700;
      font-size: .9rem;
    }
    h1 { margin: 0; font-size: clamp(2rem, 6vw, 3.6rem); letter-spacing: -.05em; }
    p { max-width: 540px; margin: 22px auto 0; color: var(--muted); font-size: 1.15rem; line-height: 1.65; }
    button {
      margin-top: 30px;
      padding: 13px 20px;
      border: 0;
      border-radius: 10px;
      color: white;
      background: var(--accent);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 18px #6c4df655;
    }
    button:hover { background: #5839df; }
    #message { min-height: 1.5em; margin-top: 18px; font-weight: 600; color: #5136d2; }
  </style>
</head>
<body>
  <main>
    <span class="badge">Proyecto de prueba</span>
    <h1>Hola, mundo 👋</h1>
    <p>Esta es mi primera página web de prueba, creada y publicada con ayuda de inteligencia artificial.</p>
    <button id="helloButton" type="button">Haz clic aquí</button>
    <div id="message" aria-live="polite"></div>
  </main>
  <script>
    document.getElementById("helloButton").addEventListener("click", () => {
      document.getElementById("message").textContent = "¡Funciona! Tu página ya es interactiva.";
    });
  </script>
</body>
</html>
